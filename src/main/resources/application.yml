server:
  port: ${PORT:8080}

spring:
  application:
    name: backend-test

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backendtest}
    username: ${DB_USER:backendtest}
    password: ${DB_PASSWORD:backendtest}

  jpa:
    # Flyway owns the schema; Hibernate only checks the mapping still matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_GROUP_ID:backend-test}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.backendtest.order
        spring.json.value.default.type: com.example.backendtest.order.OrderEvent

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A failed delivery is rejected, not requeued, so it reaches the dead-letter queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true

  webservices:
    path: /soap

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  oauth:
    client-id: ${OAUTH_CLIENT_ID:test-client}
    client-secret: ${OAUTH_CLIENT_SECRET:test-secret}
  rate-limit:
    requests-per-window: ${RATE_LIMIT_REQUESTS:100}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:60}
  http-client:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}
  shipping:
    base-url: ${SHIPPING_BASE_URL:http://localhost:8081}

resilience4j:
  retry:
    instances:
      shipping:
        max-attempts: 3
        wait-duration: 200ms
  circuitbreaker:
    instances:
      shipping:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,mappings,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: backend-test
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-cid}] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  level:
    com.example.backendtest: INFO
