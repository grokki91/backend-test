server:
  port: ${PORT:8080}

spring:
  application:
    name: backend-test
  datasource:
    url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars}
    ttl-minutes: ${JWT_TTL_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
